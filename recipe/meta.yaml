{% set name = "ag2" %}
{% set version = "1.0.4" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 2a27442df922e32571afec8a86113ab762a44eb12725d139581300e9615ba493

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - uv-build >=0.9.2,<0.13
  run:
    - python
    - pydantic >=2.6.1,<3
    - httpx >=0.28.1,<1
    - anyio >=4.0.0,<5.0.0
    - pyyaml >=6.0.2
    - fast-depends >=3.0.8,<4.0.0
  run_constrained:
    # a2a
    - a2a-sdk >=1.1.0,<2
    # a2ui
    # - jsonschema >=4.18.0,<5
    - starlette >=0.40,<2
    # acp
    - agent-client-protocol >=0.12.1,<0.13
    - uvicorn >=0.51.0,<1
    # ag-ui
    - ag-ui-protocol >=0.1.20,<0.2
    # openai
    - openai >=3.4.0,<4
    # anthropic
    - anthropic >=1.2.0,<2
    # gemini
    - google-genai >=1.68.0,<3.0
    # elevenlabs
    - elevenlabs >=1.50.0,<3
    # xai
    - xai-sdk >=1.12.2,<2
    # zai
    - zai-sdk >=0.2.3,<1
    # mistral
    - mistralai >=2.8.0,<3
    # ollama
    - ollama >=0.4.7
    # bedrock
    - boto3 >=1.34.149
    # dashscope
    - dashscope >=1.25.13
    # redis
    - redis >=5.0,<9
    # tracing
    - opentelemetry-sdk >=1.20
    # metrics
    - prometheus-client >=0.20.0,<0.30.0
    # tavily
    - tavily-python >=0.7.4,<0.8
    # ddgs
    - ddgs >=9.0.0,<10
    # perplexity
    - perplexityai >=0.30.0,<1
    # mcp
    - mcp >=2.0.0,<3
    - mcp-types >=2.0.0,<3
    # mcp-ui
    - mcp-ui-server >=1.0.0

test:
  imports:
    - ag2
    - ag2.a2a
    - ag2.a2ui
    - ag2.acp
    # ImportError: ag-ui-protocol is not installed. Please install it with:
    # pip install ag2[ag-ui]
    # - ag2.ag_ui
    - ag2.config
    - ag2.eval
    - ag2.events
    - ag2.extensions
    - ag2.files
    - ag2.knowledge
    - ag2.live
    - ag2.mcp
    - ag2.mcp_ui
    - ag2.middleware
    - ag2.network
    - ag2.observers
    - ag2.policies
    - ag2.response
    - ag2.streams
    - ag2.tools
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://www.ag2.ai/
  dev_url: https://github.com/ag2ai/ag2
  doc_url: https://docs.ag2.ai
  summary: A programming framework for agentic AI
  description: |
    AG2 (distributed on PyPI as ag2) is a programming framework for building
    multi-agent and agentic AI applications.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jan-janssen